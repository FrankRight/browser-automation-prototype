[project]
name = "browser-prototype"
version = "0.1.0"
description = "Use a website through a visible browser on Steel, with an OpenAI computer-use model reading the screen"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "openai>=3.42.1",
    "steel-sdk>=0.19.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
